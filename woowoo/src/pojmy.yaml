    **Vstup:** formule $\varphi$ v CNF nad $x_1,\dots,x_n$ a číslo $k$.

    **Otázka:** existuje ohodnocení, které $\varphi$ splňuje a má **nejvýše $k$** proměnných rovných $1$?
