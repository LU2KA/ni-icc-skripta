- id: pojem-formula-sat
  title: 'Problém $\prob{Formula-SAT}$'
  body: |
    **Vstup:** výroková formule $\varphi$ ze spojek $\lnot$, $\land$, $\lor$ a závorek, libovolně vnořená (nemusí být v CNF).

    **Otázka:** existuje ohodnocení proměnných, při kterém je $\varphi$ pravdivá?
  odkaz: un-6-1
  prob: [Formula-SAT]
  makro: []
  text: []

- id: pojem-non-equivalence
  title: 'Problém $\prob{Non-Equivalence}$'
  body: |
    **Vstup:** dvě formule $\varphi$ a $\psi$ v CNF nad proměnnými $x_1,\dots,x_n$.

    **Otázka:** existuje ohodnocení, při kterém má $\varphi$ jinou pravdivostní hodnotu než $\psi$ (formule nejsou ekvivalentní)?
  odkaz: un-6-2
  prob: [Non-Equivalence]
  makro: []
  text: []

- id: pojem-max-sat
  title: 'Problém $\prob{MAX-SAT}$'
  body: |
    **Vstup:** formule $\varphi$ v CNF s klauzulemi $C_1,\dots,C_m$ (každá má aspoň jeden literál) a číslo $k$.

    **Otázka:** existuje ohodnocení, které splní **aspoň $k$** klauzulí?
  odkaz: un-6-3
  prob: [MAX-SAT]
  makro: []
  text: []

- id: pojem-half-max-sat
  title: 'Problém $\prob{Half-MAX-SAT}$'
  body: |
    **Vstup:** formule $\varphi$ v CNF s klauzulemi $C_1,\dots,C_m$ (každá má aspoň jeden literál).

    **Otázka:** existuje ohodnocení, které splní aspoň $\lceil m/2\rceil$ klauzulí? (Je to $\prob{MAX-SAT}$ s pevným prahem.)
  odkaz: un-6-3
  prob: [Half-MAX-SAT]
  makro: []
  text: []

- id: pojem-half-sat
  title: 'Problém $\prob{Half-SAT}$'
  body: |
    **Vstup:** formule $\varphi$ v CNF s proměnnými $x_1,\dots,x_N$.

    **Otázka:** existuje ohodnocení, které $\varphi$ splňuje a při kterém má **přesně $N/2$** proměnných hodnotu $1$?
