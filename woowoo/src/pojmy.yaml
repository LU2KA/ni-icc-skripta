- id: pojem-orakulum
  title: 'Redukce s orákulem'
  body: |
    Redukce, která algoritmus pro jiný problém **volá jako podprogram**, klidně víckrát. Ten algoritmus je
    *orákulum* – černá skříňka, ze které nás zajímá jen odpověď. Karpova (polynomiální) redukce je zvláštní
    případ: orákulum se ptáme jen jednou a jeho odpověď vracíme beze změny.
  odkaz: fig-graf-redukce-s-orakulem
