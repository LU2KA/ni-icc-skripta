- id: pojem-empty
  title: 'Problém $\prob{Empty}$'
  body: |
    **Vstup:** kód Turingova stroje $\enc{M}$.

    **Otázka:** je $L_M=\emptyset$, tj. nepřijme $M$ žádné slovo?

    Jako jazyk: $\prob{Empty}=\{\enc{M} \mid L_M=\emptyset\}$.
  odkaz: un-2-6
  prob: [Empty]
  makro: []
  text: []

- id: pojem-eq
  title: 'Problém $\prob{Eq}$'
  body: |
    **Vstup:** kódy dvou Turingových strojů $\enc{M_1,M_2}$.

    **Otázka:** přijímají oba stroje tentýž jazyk, tj. $L_{M_1}=L_{M_2}$?

    Jako jazyk: $\prob{Eq}=\{\enc{M_1,M_2} \mid L_{M_1}=L_{M_2}\}$.
  odkaz: un-2-7
  prob: [Eq]
  makro: []
  text: []

