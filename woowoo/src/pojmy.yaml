# ---------------------------------------------------------------- Příloha B Typové úlohy
- id: pojem-pfp
  title: 'Problém $\prob{Path with Forbidden Pairs}$ (PFP)'
  body: |
    **Vstup:** orientovaný graf $G=(V,A)$, vrcholy $s,t\in V$ a množina zakázaných dvojic $P\subseteq\binom V2$.

    **Otázka:** existuje v $G$ orientovaná cesta (bez opakování vrcholů) z $s$ do $t$, která z žádné dvojice
    $\{u,v\}\in P$ neobsahuje oba vrcholy?
  odkaz: typ-4-1
  prob: [PFP, Path with Forbidden Pairs]
  makro: []
  text: []

- id: pojem-deg3-spanning-tree
  title: 'Problém $\prob{Deg-3 Spanning Tree}$'
  body: |
    **Vstup:** souvislý neorientovaný graf $G$.

    **Otázka:** má $G$ kostru (podgraf, který je stromem a obsahuje všechny vrcholy), v níž má každý vrchol
    stupeň nejvýše 3?
  odkaz: typ-4-2
  prob: [Deg-3 Spanning Tree]
  makro: []
  text: []

- id: pojem-fas
  title: 'Problém $\prob{Feedback Arc Set}$ (FAS)'
  body: |
    **Vstup:** orientovaný graf $G=(V,A)$ a číslo $k$.

    **Otázka:** existuje množina hran $F\subseteq A$, $|F|\le k$, taková, že graf $(V,A\setminus F)$ neobsahuje
    žádný orientovaný cyklus?
  odkaz: typ-4-4
  prob: [FAS, Feedback Arc Set]
  makro: []
  text: []

- id: pojem-ridka-mnozina
  title: 'Problém $\prob{Řídká množina}$ (dissociation set)'
  body: |
    Množina $S\subseteq V$ je *řídká*, pokud každý vrchol z $S$ má v $S$ nejvýše jednoho souseda.

    **Vstup:** neorientovaný graf $G=(V,E)$ a číslo $k$.

    **Otázka:** existuje v $G$ řídká množina $S$ s $|S|\ge k$?
  odkaz: typ-4-5
  prob: [Řídká množina]
  makro: []
  text: ['[Řř]ídk\w+ množin\w*']

- id: pojem-odebrani-na-stupen-2
  title: 'Problém $\prob{Odebrání na stupeň 2}$'
  body: |
    **Vstup:** neorientovaný graf $G=(V,E)$ a číslo $k$.

    **Otázka:** existuje $S\subseteq V$, $|S|\le k$, takové, že v $G-S$ má každý vrchol stupeň nejvýše 2?
  odkaz: typ-4-8
  prob: [Odebrání na stupeň 2]
  makro: []
  text: ['[Oo]debrání na stupeň 2']

- id: pojem-rozbiti-trojuhelniku
  title: 'Problém $\prob{Rozbití trojúhelníků}$'
  body: |
    **Vstup:** neorientovaný graf $G=(V,E)$ a číslo $k$.

    **Otázka:** existuje $S\subseteq V$, $|S|\le k$, takové, že graf $G-S$ neobsahuje žádný trojúhelník?
  odkaz: typ-4-9
  prob: [Rozbití trojúhelníků]
  makro: []
  text: ['[Rr]ozbití trojúhelníků']

- id: pojem-cvc
  title: 'Problém $\prob{Connected Vertex Cover}$ (souvislé vrcholové pokrytí)'
  body: |
    **Vstup:** souvislý graf $G=(V,E)$ a číslo $k$.

    **Otázka:** existuje vrcholové pokrytí $C\subseteq V$, $|C|\le k$, takové, že podgraf $G[C]$ je souvislý?
  odkaz: typ-2-9
  prob: [Connected Vertex Cover]
  makro: []
  text: ['[Ss]ouvisl\w* vrcholov\w* pokryt\w*']

- id: pojem-podposloupnost
  title: 'Podposloupnost (vybrané podslovo)'
  body: |
    Slovo $x$ je *podposloupnost* slova $y$, když vznikne z $y$ vynecháním některých symbolů:
    $x=y_{j_1}y_{j_2}\cdots y_{j_k}$ pro nějaké indexy $j_1<j_2<\dots<j_k$. Na rozdíl od souvislého podslova
    nemusí vybrané symboly ležet vedle sebe.
  odkaz: typ-1-7
  prob: []
  makro: []
  text: ['[Pp]odposloupnost\w*']

- id: pojem-cyklicky-posun
  title: 'Cyklický posun'
  body: |
    Slovo $x$ je *cyklický posun* slova $y$, když $y=uv$ a $x=vu$ pro nějaká slova $u,v$. Ekvivalentně
    $|x|=|y|$ a $x$ je souvislé podslovo slova $yy$.
  odkaz: typ-1-8
  prob: []
  makro: []
  text: ['[Cc]yklick\w* posun\w*']

- id: pojem-spolecne-slovo
  title: 'Problém $\prob{Společné slovo}$'
  body: |
    **Vstup:** $m$ deterministických konečných automatů $A_1,\dots,A_m$ nad abecedou $\{0,1\}$ a číslo $n$
    zapsané unárně ($1^n$).

    **Otázka:** existuje slovo $w\in\{0,1\}^n$ (délky přesně $n$), které přijímají všechny automaty?
  odkaz: typ-4-6
  prob: [Společné slovo]
  makro: []
  text: []

- id: pojem-vyvazene-rozdeleni
  title: 'Problém $\prob{Vyvážené rozdělení}$'
  body: |
    **Vstup:** $2N$ kladných celých čísel $b_1,\dots,b_{2N}$ (binárně).

    **Otázka:** lze čísla rozdělit na dvě skupiny **po $N$ číslech** se stejným součtem?
  odkaz: typ-4-7
  prob: [Vyvážené rozdělení]
  makro: []
  text: []

# ---------------------------------------------------------------- Příloha C Ukázkový test
- id: pojem-jadro
  title: 'Problém $\prob{Jádro}$'
  body: |
    Množina $K\subseteq V$ orientovaného grafu $G=(V,A)$ je *jádro*, je-li **nezávislá** (mezi žádnými dvěma
    vrcholy $K$ nevede hrana) a **absorbující** (z každého $v\notin K$ vede hrana do nějakého vrcholu $K$).

    **Vstup:** orientovaný graf $G$.

    **Otázka:** má $G$ jádro?
  odkaz: ut-4
  prob: [Jádro]
  makro: []
  text: []

# ---------------------------------------------------------------- úlohy ze sbírky (pododdíly „Úlohy z jiných sbírek“)
- id: pojem-graph-isomorphism
  title: 'Problém $\prob{Graph Isomorphism}$ (izomorfismus grafů)'
  body: |
    **Vstup:** grafy $G$ a $H$.

    **Otázka:** existuje bijekce $\psi\colon V(G)\to V(H)$, pro kterou $uv\in E(G)\iff\psi(u)\psi(v)\in E(H)$?

    Je v $\NP$, ale neví se, zda je NP-úplný.
  odkaz: un-4-9
  prob: [Graph Isomorphism]
  makro: []
  text: []

- id: pojem-3sat-3k
  title: 'Problém $\prob{3-SAT-3K}$'
  body: |
    **Vstup:** formule v CNF, kde má každá klauzule nejvýše tři literály a každá proměnná leží nejvýše ve
    **třech klauzulích**.

    **Otázka:** je formule splnitelná?

    Na rozdíl od $\prob{3-SAT-3}$ (úloha 7.6) se nepočítají výskyty, ale klauzule.
  odkaz: un-7-11
  prob: [3-SAT-3K]
  makro: []
  text: []

- id: pojem-3dm
  title: 'Problém $\prob{3DM}$ (trojrozměrné párování)'
  body: |
    **Vstup:** disjunktní množiny $X,Y,Z$, každá s $q$ prvky, a množina trojic $T\subseteq X\times Y\times Z$.

    **Otázka:** existuje $M\subseteq T$ taková, že každý prvek $X\cup Y\cup Z$ leží v právě jedné trojici z $M$
    (pak $|M|=q$)?

    Je to zvláštní případ $\prob{X3C}$.
  odkaz: un-10-10
  prob: [3DM]
  makro: []
  text: ['[Tt]rojrozměrn\w+ párován\w+']

- id: pojem-01-ilp
  title: 'Problém $\prob{0-1 ILP}$ (0/1 celočíselná přípustnost)'
  body: |
    **Vstup:** celočíselná matice $A$ typu $p\times n$ a celočíselný vektor $b$.

    **Otázka:** existuje $x\in\{0,1\}^n$ s $Ax\ge b$?
  odkaz: un-11-12
  prob: [0-1 ILP]
  makro: []
  text: []

- id: pojem-multiprocessor-scheduling
  title: 'Problém $\prob{Multiprocessor Scheduling}$ (rozvrh na $m$ strojů)'
  body: |
    **Vstup:** délky úloh $p_1,\dots,p_n$, počet strojů $m$ a termín $D$.

    **Otázka:** lze úlohy rozdělit na $m$ stejných strojů tak, aby součet délek na každém stroji byl nejvýše $D$?
  odkaz: un-11-15
  prob: [Multiprocessor Scheduling]
  makro: []
  text: []

- id: pojem-rozvrh-dva-stroje
  title: 'Problém $\prob{Rozvrh na dva stroje}$'
  body: |
    **Vstup:** délky úloh $p_1,\dots,p_n\in\N$ (zapsané binárně) a termín $D\in\N$.

    **Otázka:** lze úlohy rozdělit na dva stejné stroje tak, aby součet délek úloh na každém stroji byl nejvýše $D$?
  odkaz: typ-4-3
  prob: [Rozvrh na dva stroje]
  makro: []
  text: []

- id: pojem-bounded-degree-spanning-tree
  title: 'Problém $\prob{Bounded-Degree Spanning Tree}$ (kostra s omezeným stupněm)'
  body: |
    **Vstup:** graf $G$ a číslo $k\ge1$.

    **Otázka:** má $G$ kostru, v níž má každý vrchol stupeň nejvýše $k$?
  odkaz: un-11-16
  prob: [Bounded-Degree Spanning Tree]
  makro: []
  text: []

- id: pojem-long-cycle
  title: 'Problém $\prob{Long Cycle}$ (dlouhá kružnice)'
  body: |
    **Vstup:** neorientovaný graf $G$ a přirozené číslo $k$.

    **Otázka:** obsahuje $G$ kružnici (bez opakování vrcholů) s aspoň $k$ hranami?
  odkaz: un-14-12
  prob: [Long Cycle]
  makro: []
  text: []

- id: pojem-edge-cover
  title: 'Problém $\prob{Edge Cover}$ (hranové pokrytí)'
  body: |
    **Vstup:** graf $G=(V,E)$.

    **Úkol:** najít nejmenší $F\subseteq E$ takovou, že každý vrchol je koncem aspoň jedné hrany z $F$
    (existuje, právě když $G$ nemá izolovaný vrchol).
  odkaz: un-15-13
  prob: [Edge Cover]
  makro: []
  text: ['[Hh]ranov\w+ pokryt\w+']

- id: pojem-max-matching
  title: 'Problém $\prob{Max Matching}$ (největší párování)'
  body: |
    **Vstup:** graf $G=(V,E)$.

    **Úkol:** najít největší párování – množinu hran, z nichž žádné dvě nemají společný vrchol.
  odkaz: un-15-14
  prob: [Max Matching]
  makro: []
  text: []
