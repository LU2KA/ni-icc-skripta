  text: []

- id: pojem-rozsazeni-hostu
  title: 'Problém $\prob{Rozsazení hostů}$'
  body: |
    **Vstup:** hosté $H$, $|H|=n$, $k$ stolů po $c$ místech, dvojice nepřátel $N$, páry $P$ a pro každého hosta $g$ množina kamarádů $F(g)$.

    **Otázka:** lze každého hosta posadit k jednomu stolu tak, aby u stolu bylo nejvýše $c$ hostů, nepřátelé neseděli spolu, páry seděly spolu a každý měl u stolu aspoň jednoho kamaráda?
  odkaz: un-14-4
  prob: [Rozsazení hostů]
  makro: []
  text: []

- id: pojem-rozvrh-se-zavislostmi
  title: 'Problém $\prob{Rozvrh se závislostmi}$'
  body: |
    **Vstup:** úlohy $J$ délky $1$, počet procesorů $m$, počet kroků $T$, pro každou úlohu okno $r_j\le d_j$ a závislosti $Z\subseteq J\times J$.

    **Otázka:** lze každé úloze $j$ přidělit krok $\sigma(j)\in[r_j,d_j]$ tak, aby v žádném kroku neběželo víc než $m$ úloh a pro $(i,j)\in Z$ platilo $\sigma(i)<\sigma(j)$?
  odkaz: un-14-6
  prob: [Rozvrh se závislostmi]
  makro: []
  text: []

- id: pojem-zhasni-svetla
  title: 'Problém $\prob{Zhasni světla}$'
  body: |
    **Vstup:** graf $G=(V,E)$, množina rozsvícených vrcholů $L\subseteq V$ a číslo $k$; stisk vrcholu $v$ přepne světla v uzavřeném okolí $N[v]$.

    **Otázka:** lze nejvýše $k$ stisky zhasnout všechna světla?
  odkaz: un-14-7
  prob: [Zhasni světla]
  makro: []
  text: []

- id: pojem-prevoznik
  title: 'Problém $\prob{Převozník}$'
  body: |
    **Vstup:** předměty $V$ na levém břehu, kapacita loďky $c$, konfliktní dvojice $K$ (nesmějí zůstat na břehu bez převozníka) a počet kroků $T$ zadaný unárně.

    **Otázka:** lze všechny předměty dostat na pravý břeh nejvýše za $T$ kroků (krok = převozník přepluje s nejvýše $c$ předměty, nebo stojí)?
  odkaz: un-14-8
  prob: [Převozník]
  makro: []
  text: []

