# Pojmy pro vyskakovací okénka s definicí na webu skript (čte je tools/link_terms.py).
# Záznam s `box:` = štítek rámečku .Definition ve skriptech (okénko ukáže ten rámeček);
# záznam s `id: pojem-…` = pojem bez rámečku, definice je v `title` + `body` (Markdown, vzorce v $…$),
# `odkaz` je id místa ve skriptech, kde je pojem zaveden. U obou: `prob` = přesné argumenty \prob{…},
# `makro` = makra tříd ve vzorcích (bez \), `text` = regulární výrazy (Python re) pro běžný text;
# anglické názvy z `prob` se v textu hledají samy, kromě těch v `bez_textu`;
# hranice slov přidává program sám. Každý řetězec v `prob`/`makro` smí být jen u jednoho záznamu.
# Záznamy jsou seřazené podle kapitol.

