- id: pojem-self-redukce
  title: 'Self-redukce (samo-redukovatelnost)'
  body: |
    Technika, jak z algoritmu pro **rozhodovací** verzi problému (černé skříňky, orákula, které odpovídá jen
    ANO/NE) získat **konkrétní řešení**: instanci postupně upravujeme (mažeme hrany či vrcholy, přidáváme
    omezení) a orákulem hlídáme, že řešení v ní pořád existuje. Hodnotu optima předtím najdeme binárním
    vyhledáváním přes práh $k$. Orákulum se smí ptát jen na instance téhož problému.
  odkaz: ch-ts-od-optima-k-reseni-samo-redukovatelnost
  prob: []
  makro: []
  text: ['[Ss]elf-redukc\w*', '[Ss]amo-redukovateln\w+', '[Ss]elf-reducibility']

